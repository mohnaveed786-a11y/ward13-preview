name: Ward 13 Web Preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.3

    steps:
      - name: Checkout
        uses: actions/checkout@v4
     - name: Install Godot Web export templates
        run: |
          wget -q https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz -O /tmp/templates.tpz
          mkdir -p /github/home/.local/share/godot/export_templates/4.3.stable
          unzip -q /tmp/templates.tpz 'templates/*' -d /tmp/godot-templates
          cp /tmp/godot-templates/templates/* /github/home/.local/share/godot/export_templates/4.3.stable/
      - name: Import assets
        run: godot --headless --editor --path . --import

      - name: Export Godot web preview
        run: |
          mkdir -p build/web
          godot --headless --path . --export-release "Web" build/web/index.html
          test -s build/web/index.html
          test -s build/web/index.wasm

      - name: Upload preview
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    runs-on: ubuntu-24.04
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        name: Deploy preview
        uses: actions/deploy-pages@v4
